# Flutter's template default (-Xmx8G, 4G metaspace, doubled by the Kotlin
# daemon) fails to start alongside a running emulator on a dev machine with
# little free commit memory. 2G is plenty for this app's build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
