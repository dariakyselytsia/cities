name: cities
description: "Cities (Міста) — an offline word game: duel CityBot naming cities letter by letter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Stack is deliberately small and codegen-free — see tech_design.md §1.
dependencies:
  flutter:
    sdk: flutter

  easy_localization: ^3.0.3
  equatable: ^2.0.5
  flutter_bloc: ^8.1.5
  go_router: ^13.2.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.5
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

  # Bundled (offline) fonts, both with full Cyrillic coverage. Baloo 2 /
  # Poppins from the original design were dropped: neither supports Cyrillic.
  # Licenses: assets/fonts/OFL-*.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
