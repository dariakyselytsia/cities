# Builds what friends install (T22) and, for a version tag, publishes it as
# a GitHub Release:
#   - the Android APK, signed with the upload key from GitHub Secrets;
#   - an unsigned iOS .ipa, which each iPhone signs with a free Apple ID
#     via Sideloadly (see INSTALL.md).
# The Play App Bundle (.aab) is kept as a workflow artifact for T29.
#
# Push a tag such as v1.0.0-beta.1 (see RELEASE.md), or run it by hand to
# get the files as artifacts without a Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  android:
    name: Android (signed APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pubspec=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          tag=${GITHUB_REF_NAME#v}
          if [ "${tag%%-*}" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec version $pubspec"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The upload key secrets are missing (see RELEASE.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Collect the files
        run: |
          name="cities-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist store-dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$name-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "store-dist/$name-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: store-dist/

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # An .ipa is a zip with the app inside a Payload folder.
      - name: Package the IPA
        run: |
          name="cities-${GITHUB_REF_NAME//\//-}"
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/$name-ios.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.0.0-beta.1) is a pre-release.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cities $GITHUB_REF_NAME" \
            $prerelease \
            --notes "How to install it on Android and iPhone / Як встановити на Android та iPhone: https://github.com/$GITHUB_REPOSITORY/blob/main/INSTALL.md"
